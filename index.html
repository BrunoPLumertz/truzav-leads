<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TRUZAV · Funil de prospecção</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2224%22%20fill%3D%22%23111111%22/%3E%3Cg%20transform%3D%22translate%2820.5%2022%29%20scale%28.84%29%22%3E%3Cpath%20fill%3D%22%23F5F0E8%22%20d%3D%22M0%200H65L46%2019H0ZM88%2019L62%2019L0%2081V100H88V81H26Z%22/%3E%3Cpath%20fill%3D%22%23F0642B%22%20d%3D%22M65%200H88V19H46Z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--grafite:#111111;--creme:#F5F0E8;--laranja:#F0642B;--areia:#B8B0A4;
--bg:#F5F0E8;--surf:#FFFFFF;--surf2:#EBE5DA;--ink:#111111;--soft:#5F594F;--line:rgba(17,17,17,.16);--ot:#B4400F;--focus:#F0642B;
--s-new:#B4400F;--s-previa:#857D72;--s-conv:#9A6B08;--s-prop:#7E3412;--s-won:#2E7D4F;--s-lost:#5E5A55;
--ok:#2E7D4F;--okbg:#E2F2E7;--late:#A86A08;--latebg:#FBEBC8;--bad:#B0564E;--badbg:#F7E1DE;
--t-none:#B4400F;--t-social:#9A6B08;--t-weak:#6E675E;--shadow:0 1px 2px rgba(17,17,17,.06),0 2px 6px rgba(17,17,17,.04);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111111;--surf:#1A1A1A;--surf2:#222120;--ink:#F5F0E8;--soft:#B8B0A4;--line:rgba(245,240,232,.16);--ot:#F0642B;
--s-new:#F0642B;--s-previa:#B8B0A4;--s-conv:#E2B04A;--s-prop:#F59A6E;--s-won:#5CC48C;--s-lost:#77716A;
--ok:#5CC48C;--okbg:#1C2E23;--late:#E6B14E;--latebg:#33290F;--bad:#E58E85;--badbg:#3A2220;
--t-none:#F0642B;--t-social:#E2B04A;--t-weak:#B8B0A4;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--areia) 70%,transparent) transparent}[hidden]{display:none!important}
.head h1{position:relative;padding:2px 12px}
.head h1::before,.head h1::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--laranja)}
.head h1::before{left:0;top:0;border-right:0;border-bottom:0}
.head h1::after{right:0;bottom:0;border-left:0;border-top:0}
#map{background-color:var(--surf2);background-image:radial-gradient(color-mix(in srgb,var(--areia) 45%,transparent) 1px,transparent 1.2px);background-size:14px 14px}
.tiles-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.25)}
.leaflet-bar{border:0!important;border-radius:3px!important;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)!important}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--grafite)!important;color:var(--creme)!important;border-bottom-color:#2E2C29!important;font-family:Inter,sans-serif}
.leaflet-bar a:hover{background:var(--laranja)!important;color:var(--grafite)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surf) 88%,transparent)!important;color:var(--soft)!important;font:11px Inter,sans-serif}
.leaflet-control-attribution a{color:var(--ink)!important}
.leaflet-tooltip{background:var(--grafite);color:var(--creme);border:0;border-left:3px solid var(--laranja);border-radius:6px;font:500 13px Inter,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.25);padding:6px 10px}
.leaflet-tooltip::before{display:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
h1,h2,h3,.b,.tab,.seg button,.cm strong,.item strong,.count,.total,.stage,.pill{font-family:Sora,Inter,system-ui,sans-serif}

/* barra superior */
.nav{background:var(--grafite);color:var(--creme);display:flex;align-items:center;gap:6px;padding:0 20px;height:62px;flex:none;border-bottom:1px solid #222}
.brand{display:flex;align-items:center;margin-right:26px;padding:0 4px;color:var(--creme);--o:var(--laranja)}
.brand svg{height:18px;width:auto;display:block}
.tab svg.i{color:var(--laranja)}
.tab{all:unset;cursor:pointer;height:62px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:500;color:var(--areia);position:relative}
.tab:hover{color:var(--creme)}
.tab[aria-current="true"]{color:var(--creme)}
.tab[aria-current="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--laranja)}
.tab:focus-visible{outline:2px solid var(--laranja);outline-offset:-4px}
.nav .sp{flex:1}
.nsearch{display:flex;align-items:center;gap:8px;background:#1E1E1E;border:1px solid #2E2E2E;border-radius:3px;padding:0 12px;height:40px;width:300px;color:var(--areia)}
.nsearch input{border:0;background:transparent;outline:none;width:100%;color:var(--creme)}
.nsearch:focus-within{border-color:var(--laranja)}
/* cabeçalho do funil */
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 24px 6px}
.head h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.total{font-size:18px;font-weight:500}
.count{background:var(--grafite);color:var(--creme);font-size:12px;font-weight:500;border-radius:6px;padding:3px 8px}
@media(prefers-color-scheme:dark){.count{background:var(--creme);color:var(--grafite)}}
.head .sp{flex:1}
.b{height:42px;padding:0 16px;border-radius:3px;border:1px solid currentColor;background:transparent;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.b:hover{background:var(--surf2)}
.b.main{background:var(--laranja);border-color:var(--laranja);color:var(--grafite)}
.b.main:hover{filter:brightness(1.05);border-color:var(--laranja)}
.b.dark{background:var(--grafite);border-color:var(--grafite);color:var(--creme)}
@media(prefers-color-scheme:dark){.b.dark{background:var(--creme);border-color:var(--creme);color:var(--grafite)}}
.b.link{border-color:transparent;background:transparent;padding:0 10px}
.b.link svg.i{color:var(--ot)}
.b.link:hover{border-color:transparent;text-decoration:underline}
.b.ghost{border-color:transparent;background:transparent;color:var(--soft);font-weight:500}
.b.danger{color:var(--bad)}
/* metas */
.goals{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:4px 24px 12px;font-size:14px;color:var(--soft)}
.goals::before{content:"";width:28px;height:2px;background:var(--laranja)}
.goal{display:flex;align-items:center;gap:8px}
.goal b{color:var(--ink);font-weight:500}
.fil{width:72px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.fil i{display:block;height:100%;background:var(--laranja)}
/* barra de ferramentas */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 24px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sel{height:42px;border:1px solid var(--line);background:var(--surf);border-radius:3px;padding:0 10px}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--surf)}
.seg button{border:0;background:transparent;height:40px;padding:0 14px;display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--soft);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--grafite);color:var(--creme)}
@media(prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:var(--creme);color:var(--grafite)}}
/* quadro */
main{flex:1;min-height:0;display:flex;padding:14px 24px 18px}
.board{flex:1;display:flex;gap:16px;overflow-x:auto}
.col{flex:1 1 0;min-width:200px;display:flex;flex-direction:column;min-height:0}
.colh{padding:2px 2px 10px;border-bottom:3px solid var(--c);margin-bottom:10px}
.colh h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
.colh p{margin:2px 0 0;color:var(--soft);font-size:14px}
.colb{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 4px 8px 2px;border-radius:4px;scrollbar-width:thin}
.col.over .colb{background:color-mix(in srgb,var(--c) 10%,transparent)}
.drop{border:1.5px dashed var(--line);border-radius:4px;min-height:84px;display:grid;place-items:center;text-align:center;color:var(--soft);font-size:13px;padding:10px;
 background-image:radial-gradient(color-mix(in srgb,var(--areia) 55%,transparent) 1px,transparent 1.2px);background-size:12px 12px}
.col.over .drop{border-color:var(--c);color:var(--ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:4px;padding:12px 12px 12px 14px;display:flex;gap:10px;cursor:grab;box-shadow:var(--shadow)}
.card:hover{border-color:var(--ink)}
.card.drag{opacity:.4}
.cm{flex:1;min-width:0}
.cm strong{display:block;font-weight:500;font-size:15px;line-height:1.3}
.cm small{display:block;color:var(--soft);font-size:13px;margin-top:1px}
.val{display:block;font-size:14px;margin-top:6px;font-weight:500}
.tag{display:inline-block;font-size:12px;font-weight:500;border-radius:5px;padding:2px 7px;margin-top:8px;color:var(--t);background:color-mix(in srgb,var(--t) 13%,transparent)}
.act{position:relative;width:44px;height:44px;border-radius:4px;display:grid;place-items:center;flex:none;background:var(--okbg);color:var(--ok);text-decoration:none;align-self:center}
.act.late{background:var(--latebg);color:var(--late)}
.act.done{background:var(--surf2);color:var(--soft)}
.act.lost{background:var(--badbg);color:var(--bad)}
.act svg.i{width:20px;height:20px}
.act .w{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:3px;background:var(--surf);display:grid;place-items:center}
.act .w svg.i{width:14px;height:14px;color:var(--late)}
/* mapa */
.mapv{flex:1;display:flex;min-height:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surf)}
#map{flex:1;min-height:320px;position:relative}
.mapmsg{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(440px,calc(100% - 80px));text-align:left;padding:12px 14px;color:var(--soft);z-index:800;pointer-events:none;background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--laranja);border-radius:3px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mapmsg strong{display:block;color:var(--ink);font-family:Sora,Inter,sans-serif;font-size:15px;margin-bottom:2px}
.side{width:350px;border-left:1px solid var(--line);overflow-y:auto;background:var(--surf)}
.side h2{font-size:16px;margin:16px 16px 4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 16px 12px;font-size:12px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 16px;cursor:pointer}
.item:hover{background:var(--surf2)}
.item .cm small{margin:0}
.placing{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:1000;background:var(--grafite);color:var(--creme);padding:9px 16px;border-radius:3px;font-weight:500;border-left:3px solid var(--laranja)}
/* painel de detalhes */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.4);z-index:1400}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surf);z-index:1500;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.22)}
.dh{padding:22px 22px 18px;border-bottom:1px solid var(--line);position:relative;border-top:4px solid var(--laranja)}
.dh h2{font-size:21px;margin:0 44px 2px 0;line-height:1.25}
.x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:3px;border:0;background:transparent;cursor:pointer;color:var(--soft);font-size:24px;line-height:1}
.x:hover{background:var(--surf2)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--c);margin:10px 10px 0 0}
.warn{background:var(--latebg);border-radius:3px;padding:10px 12px;margin:14px 0 0;font-size:14px}
.ds{padding:18px 22px;border-bottom:1px solid var(--line)}
.ds h3{font-size:13px;color:var(--soft);font-weight:500;margin:0 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts .b{flex:1 1 auto}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:500;color:var(--soft)}
.t{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--surf2);width:100%}
textarea.t{min-height:110px;resize:vertical}
.muted{color:var(--soft);font-size:14px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--grafite);color:var(--creme);padding:11px 18px;border-radius:3px;font-weight:500;z-index:2000;max-width:90vw;border-left:3px solid var(--laranja)}
.toast:empty{display:none}
.leaflet-container{font:inherit;background:var(--surf2)}
@media(max-width:900px){.nsearch{display:none}.head .total{width:100%;order:3}}
@media(max-width:700px){
 .nav{padding:0 10px;height:56px}.brand{margin-right:6px;font-size:16px}.tab{height:56px;padding:0 10px}.tab span{display:none}
 .head,.goals{padding-left:14px;padding-right:14px}.bar{margin:0 14px}main{padding:12px 14px 14px}
 .bar .msearch{display:flex!important;flex:1 1 100%}
 .col{min-width:84vw}
 .mapv{flex-direction:column}#map{flex:0 0 50vh}.side{width:auto;border-left:0;border-top:1px solid var(--line)}
 .drawer{top:auto;max-height:90vh;border-radius:14px 14px 0 0}
 .head .b.main span{display:none}
}
.msearch{display:none;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:0 12px;height:42px}
.msearch input{border:0;background:transparent;outline:none;width:100%}
@media(prefers-reduced-motion:no-preference){.drawer{animation:din .22s ease-out}@keyframes din{from{transform:translateX(28px);opacity:0}}}
.b,.tab,.seg button,.cm strong,.item strong,.count,.total,.stage,.colh h2,.drawer h2,.side h2{font-weight:600}
.head h1{font-weight:700}

.histv{flex:1;overflow-y:auto;background:var(--surf);border:1px solid var(--line);border-radius:4px;padding:6px 24px 24px}
.day{margin-top:18px}
.day h2{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.day h2::before{content:"";width:20px;height:2px;background:var(--laranja)}
.hrow{display:grid;grid-template-columns:56px minmax(160px,240px) 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.hrow time{color:var(--soft);font-size:13px}
.hrow button{all:unset;cursor:pointer;font-family:Sora,Inter,sans-serif;font-weight:600}
.hrow button:hover{text-decoration:underline}
.hrow button:focus-visible{outline:2px solid var(--focus)}
.hrow p{margin:0}.hrow small{display:block;color:var(--soft)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 20px;border-left:2px solid var(--line);margin-left:5px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:2px;background:var(--c,var(--areia))}
.tl time{display:block;font-size:12px;color:var(--soft)}
.tl p{margin:2px 0 0}.tl small{display:block;color:var(--soft);margin-top:2px;white-space:pre-wrap}
.tl .del{all:unset;cursor:pointer;font-size:12px;color:var(--soft);margin-top:4px;display:inline-block}
.tl .del:hover{color:var(--bad)}
.logf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logf .full{grid-column:1/-1}
.logf textarea.t{min-height:70px}
.empty{color:var(--soft);padding:24px 0}
@media(max-width:700px){.hrow{grid-template-columns:48px 1fr}.hrow p{grid-column:2}.histv{padding:4px 14px 18px}}

.pm{position:fixed;inset:0;z-index:1700;background:var(--bg);display:flex}
.pmside{width:360px;flex:none;overflow-y:auto;background:var(--surf);border-right:1px solid var(--line);padding:18px 20px 28px}
.pmtop{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}.pmtop h2{font-size:18px;margin:0}
.pmacts{display:grid;gap:8px;margin-top:14px}.pmacts .b{width:100%;white-space:normal;height:auto;min-height:42px;padding:9px 14px;text-align:center}
.pmmain{flex:1;overflow-y:auto;padding:22px}
.pmhint{max-width:820px;margin:0 auto 10px}
.doc{max-width:820px;margin:0 auto;background:#fff;color:#111;font:15px/1.6 Inter,system-ui,sans-serif;box-shadow:0 4px 24px rgba(0,0,0,.18);outline:none}
.doc:focus-within{box-shadow:0 0 0 2px var(--laranja),0 4px 24px rgba(0,0,0,.18)}
.dhd{background:#111;color:#F5F0E8;--o:#F0642B;display:flex;justify-content:space-between;align-items:center;padding:26px 44px}
.dhd svg{height:20px;width:auto}.dhd span{font:600 13px Sora,Inter,sans-serif;color:#B8B0A4;letter-spacing:.04em}
.dbd{padding:34px 44px 40px}
.doc .for{color:#5F594F;font-size:14px;margin:0 0 24px}
.doc h1{font:700 28px/1.2 Sora,Inter,sans-serif;margin:0 0 10px;position:relative;padding:4px 14px;display:inline-block}
.doc h1::before,.doc h1::after{content:"";position:absolute;width:12px;height:12px;border:2px solid #F0642B}
.doc h1::before{left:0;top:0;border-right:0;border-bottom:0}.doc h1::after{right:0;bottom:0;border-left:0;border-top:0}
.doc .lead{font-size:17px;margin:6px 0 8px;max-width:60ch}
.doc h2{font:600 17px Sora,Inter,sans-serif;margin:28px 0 8px;display:flex;align-items:center;gap:10px}
.doc h2::before{content:"";width:22px;height:2px;background:#F0642B;flex:none}
.doc p{margin:0 0 8px;max-width:66ch}.doc ul,.doc ol{margin:6px 0 0;padding-left:22px}.doc li{margin:4px 0}
.doc .note{background:#F5F0E8;border-left:3px solid #F0642B;padding:10px 14px;margin-top:16px;font-size:14px}
.doc table{border-collapse:collapse;width:100%;margin-top:6px}
.doc th,.doc td{text-align:left;padding:10px 0;border-bottom:1px solid rgba(17,17,17,.14);vertical-align:top}
.doc th{font-weight:500;color:#5F594F;width:42%}.doc td{font-weight:500}
.doc tr:first-child td{font:700 18px Sora,Inter,sans-serif}
.dft{margin-top:32px;padding-top:18px;border-top:1px solid rgba(17,17,17,.14);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:#5F594F}
.dft p{margin:0}.dft .sig{font:600 15px Sora,Inter,sans-serif;color:#111}
body.pmopen{overflow:hidden}
@media(max-width:900px){.pm{flex-direction:column;overflow-y:auto}.pmside{width:auto;border-right:0;border-bottom:1px solid var(--line)}.pmmain{overflow:visible;padding:14px}.dhd,.dbd{padding-left:22px;padding-right:22px}}
@media print{
 @page{size:A4;margin:14mm 0}
 @page :first{margin-top:0}
 body.pmopen{display:block;background:#fff}
 body.pmopen > *:not(#pm){display:none!important}
 body.pmopen #pm{position:static;display:block;background:#fff}
 .pmside,.pmhint{display:none!important}
 .pmmain{padding:0;overflow:visible}
 .doc{box-shadow:none!important;max-width:none;margin:0}
 .dhd,.doc .note{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .doc h2,.doc li,.doc tr{break-inside:avoid}
}

.fhd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.fhd h3{margin:0!important}
.chk{font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input,.fres input{width:18px;height:18px;accent-color:var(--laranja);flex:none}
.fres{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.fres.off{opacity:.55;cursor:default}
.fres .cm small{margin-top:2px}
.fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}.fmeta .tag{margin-top:0}
.fmeta a{font-size:13px;color:var(--ot);font-weight:500}
.b:disabled{opacity:.55;cursor:default}
@media(max-width:700px){#findBtn span{display:none}}

.doc table.cmp{margin:10px 0 12px;font-size:14px}
.doc table.cmp th,.doc table.cmp td{padding:9px 10px;width:auto;font-weight:400;color:#111}
.doc table.cmp tbody th{font-weight:500;color:#5F594F;width:24%}
.doc table.cmp thead th{font:600 13px Sora,Inter,sans-serif;color:#5F594F;border-bottom:2px solid rgba(17,17,17,.2)}
.doc table.cmp thead th:last-child{color:#111;border-bottom-color:#F0642B}
.doc table.cmp td:last-child{background:#F5F0E8;font-weight:500}
.doc table.cmp tr:first-child td{font:inherit}
.doc table.cmp tr:first-child td:last-child{font-weight:500}
.doc table.cmp td:last-child{-webkit-print-color-adjust:exact;print-color-adjust:exact}

.prova{border-left:3px solid var(--laranja);background:var(--surf2);padding:10px 12px;margin:0 0 8px;border-radius:0 3px 3px 0}
.prova p{margin:0;white-space:pre-wrap}.prova small{display:block;color:var(--soft);margin-top:4px;font-size:12px}
.prova .del{all:unset;cursor:pointer;color:var(--soft);text-decoration:underline}.prova .del:hover{color:var(--bad)}
.maplink{display:inline-block;margin:10px 0 0 10px;font-size:13px;font-weight:500;color:var(--ot)}
.doc blockquote{margin:10px 0;padding:12px 16px;background:#F5F0E8;border-left:3px solid #F0642B;font-size:15px;font-style:italic;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
.doc blockquote cite{display:block;font-style:normal;font-size:12px;color:#5F594F;margin-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font:500 13px Inter,sans-serif;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;padding:6px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .muted{margin:0}

.pvmain{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surf2)}
.pvframe{width:100%;max-width:1100px;flex:1;min-height:600px;border:1px solid var(--line);border-radius:4px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.pvframe.m{width:390px;max-width:100%;border-radius:22px;border:8px solid #111}

<script>
(()=>{

const $=s=>document.querySelector(s);

let tt;const toast=t=>{$("#toast").textContent=t;clearTimeout(tt);tt=setTimeout(()=>$("#toast").textContent="",3500)};

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items))return s}catch(e){}
  return {items:SEED.map((a,i)=>({id:a[0],name:a[1],cat:a[2],tipo:a[3],phone:a[4],lat:a[5],lng:a[6],notes:a[7]||"",status:"new",order:i+1}))}}
let data=load(),view="board",q="",ft="",openId=null,placing=null,map=null,layer=null,fitted=false,confirmDel=false,tileFail=false;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("Não foi possível salvar neste navegador. Exporte um backup.")}}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const now=()=>new Date().toISOString();
const dayOf=iso=>new Date(iso).toLocaleDateString("sv-SE");
const hhmm=iso=>new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const CANAIS=["WhatsApp","Ligação","Visita","Instagram","E-mail","Outro"];
data.items.forEach(it=>{if(!Array.isArray(it.hist)){it.hist=[];if(it.contacted&&it.status!=="new")it.hist.push({id:uid(),d:it.contacted+"T12:00:00",t:"nota",txt:"Primeiro contato (registrado antes do histórico)."})}});
function addLog(it,e){it.hist=it.hist||[];it.hist.push({id:uid(),d:now(),...e})}
const lastAct=it=>{const h=(it.hist||[]).filter(e=>e.t==="contato"||e.t==="status").map(e=>dayOf(e.d)).sort();return h.length?h[h.length-1]:it.contacted};
const touchedToday=it=>(it.hist||[]).some(e=>dayOf(e.d)===today()&&(e.t==="contato"||(e.t==="status"&&e.from==="new")));
function descr(e){
  if(e.t==="status")return [`Etapa: ${LBL[e.from]||e.from} → ${LBL[e.to]||e.to}`,""];
  if(e.t==="contato")return [`${e.canal||"Contato"}${e.com?" com "+e.com:""}`,e.txt||""];
  if(e.t==="add")return [e.txt?"Adicionado pelo "+e.txt:"Adicionado à lista",""];
  if(e.t==="proposta")return [`Proposta enviada: ${e.tipo}, ${money(e.valor)}`,""];
  return [e.txt||"",""];
}
persist();
const byId=id=>data.items.find(i=>i.id===id);
const visible=()=>data.items.filter(i=>(!q||(i.name+" "+i.cat+" "+i.tipo).toLowerCase().includes(q))&&(!ft||i.tipo===ft));
function update(id,p,quiet){Object.assign(byId(id),p);persist();if(!quiet)renderAll()}
function move(id,s){const it=byId(id);if(!it||it.status===s)return;const p={status:s,changed:today()};if(s!=="new"&&!it.contacted)p.contacted=today();addLog(it,{t:"status",from:it.status,to:s});update(id,p);toast(`${it.name} agora está em “${LBL[s]}”.`)}
function wa(p){const d=(p||"").replace(/\D/g,"");const l=d.replace(/^55/,"");return l.length===11&&l[2]==="9"?"https://wa.me/55"+l:null}
const waiting=it=>it.status==="previa"&&lastAct(it)&&days(lastAct(it))>=2;
function tag(t){const s=el("span","tag",t);s.style.setProperty("--t",`var(${TCOL(t)})`);return s}
function actBtn(it){
  const s=it.status;
  if(s==="won"||s==="lost"){const a=el("span","act "+(s==="won"?"done":"lost"));a.append(svg(s==="won"?IC.ok:IC.no));a.setAttribute("aria-hidden","true");return a}
  const w=wa(it.phone),a=el("a","act"+(waiting(it)?" late":""));
  if(w){a.href=w;a.target="_blank";a.rel="noopener";a.title="Abrir no WhatsApp";a.setAttribute("aria-label","WhatsApp de "+it.name);a.append(svg(IC.wa))}
  else if(it.phone){a.href="tel:"+it.phone.replace(/[^\d+]/g,"");a.title="Ligar";a.setAttribute("aria-label","Ligar para "+it.name);a.append(svg(IC.tel))}
  else{const x=el("span","act done");x.append(svg(IC.tel));return x}
  if(waiting(it)){const w2=el("span","w");w2.append(svg(IC.warn));a.append(w2);a.title=`Sem resposta há ${days(lastAct(it))} dias`}

}
function head(){
  const I=data.items,c=a=>I.filter(r=>a.includes(r.status)).length,n=I.filter(touchedToday).length;
  const open=I.filter(r=>r.status!=="lost").reduce((s,r)=>s+(+r.valor||0),0);
  $("#total").textContent=open?money(open)+" em propostas":"";
  $("#count").textContent=`${I.length} negócios`;
  const g=$("#goals");g.replaceChildren();
  [["Hoje",n,DAY_GOAL,"contatos"],["Contatados",I.length-c(["new"]),100,""],["Conversas",c(["conv","prop","won"]),15,""],["Propostas",c(["prop","won"]),5,""],["Vendas",c(["won"]),1,""]].forEach(([l,v,m,suf])=>{
    const d=el("div","goal"),f=el("span","fil"),i=el("i");i.style.width=Math.min(100,v/m*100)+"%";f.append(i);

}
function board(){
  const b=$("#board");b.replaceChildren();const v=visible();
  ST.forEach(([s,l])=>{
    const its=v.filter(i=>i.status===s).sort((a,c)=>a.order-c.order),sum=its.reduce((a,i)=>a+(+i.valor||0),0);
    const col=el("section","col");col.style.setProperty("--c",`var(--s-${s})`);col.setAttribute("aria-label",l);
    const h=el("div","colh");h.append(el("h2",0,l),el("p","num",`${its.length} • ${money(sum)}`));col.append(h);

    its.forEach(it=>{
      const c=el("div","card");c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-label",`${it.name}. Abrir detalhes`);c.draggable=true;

function side(){
  const s=$("#side");s.replaceChildren();const v=visible(),order=Object.keys(LBL);

function mapMsg(title,text){$("#mapmsg")?.remove();const m=el("div","mapmsg"),d=el("div");m.id="mapmsg";d.append(el("strong",0,title),el("span",0,text));m.append(d);$("#map").append(m)}
function initMap(){
  if(map)return;
  if(!window.L){mapMsg("O mapa não carregou.","Baixe o arquivo e abra direto no Chrome ou no Edge, com internet. Pela pré-visualização do Claude o mapa fica bloqueado. O funil funciona normalmente.");return}
  map=L.map("map").setView([-30.08,-51.05],13);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  if(matchMedia("(prefers-color-scheme: dark)").matches)$("#map").classList.add("tiles-dark");
  const P=[["https://tile.openstreetmap.org/{z}/{x}/{y}.png",'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'],
           ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",'Mapa &copy; Esri, dados &copy; OpenStreetMap']];
  const tiles=i=>{const tl=L.tileLayer(P[i][0],{maxZoom:19,attribution:P[i][1]}).addTo(map);let f=0,ok=0;
    tl.on("tileload",()=>{ok++;$("#mapmsg")?.remove()});
    tl.on("tileerror",()=>{if(ok||++f<4)return;f=-1e9;map.removeLayer(tl);
      if(i+1<P.length)tiles(i+1);else if(!tileFail){tileFail=true;mapMsg("As imagens do mapa não carregaram.","Confira a internet. Os pontos dos negócios continuam clicáveis.")}})};
  tiles(0);
  layer=L.layerGroup().addTo(map);
  map.on("click",e=>{if(!placing)return;const id=placing;placing=null;$("#placing")?.remove();update(id,{lat:+e.latlng.lat.toFixed(7),lng:+e.latlng.lng.toFixed(7)});toast("Local salvo no mapa.");openItem(id)});
}
function markers(){
  if(!map)return;layer.clearLayers();const pts=[];
  visible().filter(i=>i.lat!=null).forEach(it=>{const sel=it.id===openId;
    const m=L.circleMarker([it.lat,it.lng],{radius:sel?12:8,color:sel?cssv("--laranja"):cssv("--surf"),weight:sel?3:2,fillColor:cssv(`--s-${it.status}`),fillOpacity:1});
    m.bindTooltip(`${it.name}: ${LBL[it.status]}`);m.on("click",()=>openItem(it.id));m.addTo(layer);pts.push([it.lat,it.lng])});
  if(!fitted&&pts.length){map.fitBounds(pts,{padding:[40,40],maxZoom:15});fitted=true}
}

function waText(doc){
  const out=[];doc.querySelectorAll(".dbd > *").forEach(n=>{
    const tg=n.tagName,tx=n.innerText.trim();if(!tx)return;
    if(tg==="H1")out.push("*"+tx+"*");else if(tg==="H2")out.push("\n*"+tx+"*");
    else if(tg==="UL")n.querySelectorAll("li").forEach(l=>out.push("• "+l.innerText.trim()));
    else if(tg==="OL")n.querySelectorAll("li").forEach((l,i)=>out.push(`${i+1}. `+l.innerText.trim()));
    else if(tg==="BLOCKQUOTE")out.push("> "+n.childNodes[0].textContent.trim()+" ("+(n.querySelector("cite")?.innerText||"").trim()+")");
    else if(tg==="TABLE"&&n.classList.contains("cmp"))n.querySelectorAll("tbody tr").forEach(r=>out.push("• "+r.cells[0].innerText.trim()+": "+r.cells[2].innerText.trim()));
    else if(tg==="TABLE")n.querySelectorAll("tr").forEach(r=>out.push(r.cells[0].innerText.trim()+": "+r.cells[1].innerText.trim()));
    else if(tg==="FOOTER")out.push("\n"+tx);else out.push(tx)});
  return out.join("\n").replace(/\n{3,}/g,"\n\n");
}

function parseMaps(u){
  let s;try{s=decodeURIComponent(u)}catch(e){s=u}
  const nm=(s.match(/\/maps\/place\/([^/@?]+)/)||[])[1];
  const m=s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  let q="";try{q=new URL(u).searchParams.get("q")||""}catch(e){}
  return {name:(nm||q||"").replace(/\+/g," ").trim(),lat:m?+m[1]:null,lng:m?+m[2]:null};
}
async function resolveMaps(txt){
  const mu=txt.match(/https?:\/\/\S+/);if(!mu)throw new Error("Cole um link do Google Maps (começa com https://).");
  const link=mu[0].replace(/[)\].,]+$/,""),before=txt.slice(0,mu.index).trim().split("\n").filter(Boolean)[0]||"";
  let host="";try{host=new URL(link).hostname}catch(e){throw new Error("Esse link não parece válido.")}
  let full=link;
  if(/(^|\.)goo\.gl$/.test(host)){
    let r;try{r=await fetch("/api/maps?u="+encodeURIComponent(link))}catch(e){r=null}
    if(!r||!r.ok)throw new Error(location.protocol==="file:"?"Links curtos (maps.app.goo.gl) só funcionam pela ferramenta na Vercel. Aqui no arquivo local, abra o link no navegador e cole o endereço completo da barra.":"Não consegui abrir esse link curto agora. Tente de novo ou cole o endereço completo da barra do navegador.");
    full=(await r.json()).url||link;
  }else if(!/google\./.test(host))throw new Error("Esse link não é do Google Maps.");
  const p=parseMaps(full);if(!p.name&&before)p.name=before;
  if(!p.name&&p.lat==null)throw new Error("Não consegui ler esse link. Abra o negócio no Google Maps (não a lista de resultados) e copie o link dele.");
  return {...p,link};
}

</style></head><body>

let pvId=null,pvDev="m";

function closePreview(){$("#pm").hidden=true;document.body.classList.remove("pmopen");const id=pvId;pvId=null;if(id)openItem(id)}
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const slug=t=>norm(t).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function previewEditor(){
  const it=byId(pvId),pm=$("#pm");if(!it)return;const o=pvOpts(it);pm.replaceChildren();
  const side=el("aside","pmside"),main=el("div","pmmain pvmain");
  const top=el("div","pmtop"),x=el("button","b","Voltar ao negócio");x.onclick=closePreview;top.append(el("h2",0,"Prévia do site: "+it.name),x);side.append(top);
  const save=()=>{it.prev={title:ti.value,sub:su.value,svc:sv.value,cor:co.value,map:mp?mp.checked:false};persist()};
  const fld=(lab,node)=>{const w=el("div","field"),l=el("label",0,lab);l.htmlFor=node.id;w.append(l,node);side.append(w);return node};
  const ti=el("input","t");ti.id="v-ti";ti.value=o.title;fld("Título",ti);

  const sv=el("textarea","t");sv.id="v-sv";sv.value=o.svc;sv.style.minHeight="110px";fld("Serviços (um por linha)",sv);
  const co=el("input","t");co.id="v-co";co.type="color";co.value=o.cor;co.style.height="44px";co.style.padding="4px";fld("Cor principal",co);
  const fi=el("input","t");fi.id="v-fi";fi.type="file";fi.accept="image/*";fi.multiple=true;fld("Fotos (opcional, até 6)",fi);
  const fh=el("p","muted",(pvPhotos[it.id]||[]).length?`${pvPhotos[it.id].length} foto(s) carregada(s). A primeira vai no topo.`:"A primeira foto vai no topo. As fotos não ficam salvas depois que você fecha a ferramenta.");fh.style.cssText="font-size:13px;margin:-6px 0 12px";side.append(fh);
  let mp=null;if(it.lat!=null){const l=el("label","chk");mp=el("input");mp.type="checkbox";mp.checked=!!o.map;l.append(mp,document.createTextNode(" Mostrar mapa da localização"));l.style.margin="0 0 14px";side.append(l)}
  const tg=el("div","chips");[["m","Celular"],["d","Computador"]].forEach(([k,lab])=>{const b=el("button","chip",lab);b.type="button";b.setAttribute("aria-pressed",pvDev===k);b.onclick=()=>{pvDev=k;previewEditor()};tg.append(b)});
  const acts=el("div","pmacts");
  const bi=el("button","b main","Baixar imagem para WhatsApp"),bh=el("button","b","Baixar HTML"),bo=el("button","b","Abrir em nova aba");
  acts.append(bi,bh,bo);side.append(acts);
  const note=el("p","muted","Os textos são exemplos do ramo. Revise antes de enviar e deixe claro na mensagem que é uma prévia.");note.style.cssText="font-size:13px;margin-top:12px";side.append(note);
  const frame=el("iframe","pvframe"+(pvDev==="m"?" m":""));frame.title="Prévia do site";
  main.append(tg,frame);pm.append(side,main);
  let tm;const render=()=>{clearTimeout(tm);tm=setTimeout(()=>{save();frame.srcdoc=previewHTML(it,pvOpts(it),false)},250)};
  [ti,su,sv,co].forEach(n=>n.oninput=render);if(mp)mp.onchange=render;
  fi.onchange=async()=>{const fs=[...fi.files].slice(0,6);if(!fs.length)return;fh.textContent="Preparando as fotos…";
    pvPhotos[it.id]=await Promise.all(fs.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(f)})));
    fh.textContent=`${pvPhotos[it.id].length} foto(s) carregada(s). A primeira vai no topo.`;render()};
  const logP=()=>{if(!(it.hist||[]).some(e=>e.t==="nota"&&e.txt==="Prévia do site criada"&&dayOf(e.d)===today())){addLog(it,{t:"nota",txt:"Prévia do site criada"});persist()}};
  bh.onclick=()=>{save();dl(`previa-${slug(it.name)}.html`,new Blob([previewHTML(it,pvOpts(it),false)],{type:"text/html"}));logP();toast("Prévia baixada em HTML.")};
  bo.onclick=()=>{save();const u=URL.createObjectURL(new Blob([previewHTML(it,pvOpts(it),false)],{type:"text/html"}));window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000)};
  bi.onclick=()=>{save();bi.disabled=true;bi.textContent="Gerando a imagem…";
    const f=document.createElement("iframe");f.style.cssText="position:fixed;left:-9999px;top:0;width:390px;height:844px;border:0";document.body.append(f);
    const done=(ok,msg)=>{f.remove();bi.disabled=false;bi.textContent="Baixar imagem para WhatsApp";toast(msg)};
    f.onload=()=>{const w2=f.contentWindow;let n=0;const wait=setInterval(async()=>{n++;if(w2.html2canvas){clearInterval(wait);try{await w2.document.fonts.ready;w2.document.querySelector(".demo").style.cssText="position:static;transform:none;display:block;width:max-content;margin:0 auto 28px";
        const cv=await w2.html2canvas(w2.document.body,{scale:2,width:390,windowWidth:390,backgroundColor:"#fbfaf8",useCORS:true});
        cv.toBlob(b=>{dl(`previa-${slug(it.name)}.png`,b);logP();done(true,"Imagem baixada. Envie no WhatsApp junto com a mensagem.")},"image/png")}catch(e){done(false,"Não consegui gerar a imagem. Use “Abrir em nova aba” e tire um print.")}}
      else if(n>40){clearInterval(wait);done(false,"Não consegui gerar a imagem sem internet. Use “Abrir em nova aba” e tire um print.")}},150)};
    f.srcdoc=previewHTML(it,pvOpts(it),true)};
  frame.srcdoc=previewHTML(it,o,false);
}

/* ===== Mensagens prontas ===== */
const saud=()=>{const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"};
const firstName=it=>((it.contato||"").split(/[,(\-–]/)[0].trim().split(/\s+/)[0]||"");
const ART_M=["centro","studio","estudio","espaco","salao","restaurante","instituto","escritorio","consultorio","atelie","mercado","mercadinho","bar","cafe","pet","petshop","hotel","laboratorio","ct","clube","buffet","armazem","emporio","acougue","posto","brecho","grupo","auto","box","sitio"];
const ART_F=["barbearia","clinica","padaria","confeitaria","doceria","academia","oficina","mecanica","loja","imobiliaria","construtora","escola","pizzaria","lanchonete","otica","farmacia","estetica","advocacia","contabilidade","floricultura","casa","distribuidora","agencia","autoescola","papelaria","livraria","sorveteria","hamburgueria","cafeteria","marmoraria","vidracaria","serralheria","borracharia","funilaria","lavanderia","ferragem","madeireira","creche","cervejaria","pastelaria","tabacaria","adega","boutique","otica"];
const artOf=n=>{const w=norm(n).split(/[^a-z0-9]+/).filter(Boolean)[0]||"";return ART_M.includes(w)?"o":ART_F.includes(w)?"a":""};
const deArt=n=>({o:"do ",a:"da "}[artOf(n)]||"de ")+n;
const paraArt=n=>"para "+({o:"o ",a:"a "}[artOf(n)]||"")+n;
function msgs(it){
  const n=it.name,pn=firstName(it),oi=pn?`Oi, ${pn}!`:"Oi, tudo bem?",hasP=(it.provas||[]).length>0;
  const apres="Sou da TRUZAV, criamos sites para empresas da região.";
  const prova="um cliente comentou que tentou falar com vocês e não conseguiu. Com um site, telefone, WhatsApp e horários ficam sempre à mão, e isso não se perde mais.";
  const enviar=`${oi} Como combinamos, segue a proposta do site ${deArt(n)}.\n\nColoquei como está hoje, o que o site teria e algumas sugestões pensadas para o que vocês fazem.\n\nDá uma olhada com calma e me conta o que achou. Se quiser ajustar alguma coisa, a gente adapta.`;
  const enviarP=`${oi} Segue a proposta do site ${deArt(n)}.\n\nUma coisa me chamou atenção: no Google, ${prova}\n\nEstá tudo explicado no PDF. Qualquer dúvida, é só me chamar por aqui.`;
  const M={
   new:[!pn&&["Descobrir quem decide",`${saud()}, tudo bem? Aqui é da TRUZAV, criamos sites para empresas da região.\n\nVi o perfil ${deArt(n)} no Google e tenho uma ideia para ajudar vocês a receber mais contatos por lá. Com quem eu posso falar sobre isso?`],
        ["Primeiro contato com proposta",pn?`Oi, ${pn}, tudo bem? ${apres}\n\nVi o perfil ${deArt(n)} no Google e preparei uma proposta pensando no que vocês fazem. Mando o PDF aqui, sem compromisso.\n\nSe fizer sentido, te explico tudo em 5 minutos, por mensagem ou ligação.`:`Oi, pessoal ${deArt(n)}, tudo bem? ${apres}\n\nVi o perfil de vocês no Google e preparei uma proposta pensando no que vocês fazem. Mando o PDF aqui, sem compromisso.\n\nSe fizer sentido, te explico tudo em 5 minutos, por mensagem ou ligação.`],
        hasP&&["Primeiro contato citando comentário",`${pn?`Oi, ${pn}, tudo bem?`:`Oi, pessoal ${deArt(n)}, tudo bem?`} ${apres}\n\nVi o perfil de vocês no Google e um comentário me chamou atenção: ${prova}\n\nPreparei uma proposta, sem compromisso. Posso te mandar?`]],
   previa:[["Lembrete",`${oi} Passando para saber se você viu minha mensagem. Se preferir, te explico em um áudio rápido.`],["Enviar a proposta",enviar],hasP&&["Enviar a proposta citando comentário",enviarP]],
   conv:[["Enviar a proposta",enviar],hasP&&["Enviar a proposta citando comentário",enviarP]],
   prop:[["Lembrete da proposta",`${oi} Conseguiu dar uma olhada na proposta? Se tiver alguma dúvida ou quiser ajustar algo, é só me dizer.`],
         ["Última mensagem",`${oi} Não quero insistir, então esta é minha última mensagem sobre a proposta. Se mais para frente fizer sentido, é só me chamar por aqui. Sucesso ${paraArt(n)}!`]],
   won:[["Agradecer e pedir indicação",`${oi} Obrigado pela confiança na TRUZAV! Se conhecer alguém que também precise de site, pode passar meu contato. Indicação é o que mais ajuda a gente.`]],
   lost:[["Retomar contato",`${oi} Tudo bem? Falamos sobre o site ${deArt(n)} há um tempo. Se agora for um bom momento, posso atualizar a proposta para vocês.`]]};
  return (M[it.status]||[]).filter(Boolean);
}
let msgSel={};
function msgSection(it){

    a.onclick=e=>{a.href=w+"?text="+encodeURIComponent(ta.value)};ac.append(a)}
  const cp=el("button","b","Copiar");cp.type="button";cp.onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);toast("Mensagem copiada.")}catch(e){ta.select();toast("Selecione e copie o texto.")}};ac.append(cp);
  const hint=el("p","muted",w?"Revise antes de enviar. Depois, registre o contato no bloco abaixo.":"Esse telefone não parece ser de WhatsApp. Copie a mensagem e envie por onde preferir.");hint.style.fontSize="13px";

function histView(){
  const box=$("#histv");box.replaceChildren();const ids=new Set(visible().map(i=>i.id));

    if(dd!==cur){cur=dd;sec=el("section","day");sec.append(el("h2",0,dd===today()?"Hoje":dd===ont?"Ontem":br(dd)));box.append(sec)}
    const r=el("div","hrow"),tm=el("time",0,hhmm(e.d)),nb=el("button",0,it.name),[t1,t2]=descr(e),pp=el("p",0,t1);tm.dateTime=e.d;

TIPOS.forEach(t=>{const o=el("option",0,t);o.value=t;$("#ft").append(o)});
